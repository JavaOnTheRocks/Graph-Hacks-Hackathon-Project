
services:
  postgres:
    image: postgres:17
    container_name: GraphHacks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: GraphHacks
      POSTGRES_USER: GraphHacks_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - GraphHacks_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U GraphHacks_user -d GraphHacks"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  GraphHacks_pgdata:
