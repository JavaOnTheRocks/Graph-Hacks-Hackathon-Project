
services:
  postgres:
    image: postgres:17
    container_name: GraphHacks-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: GraphHacks
      POSTGRES_USER: GraphHacks_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - GraphHacks_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U GraphHacks_user -d GraphHacks"]
      interval: 5s
      timeout: 5s
      retries: 10

  falkordb:
    image: falkordb/falkordb:latest
    container_name: GraphHacks-falkordb
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3000:3000"
    volumes:
      - GraphHacks_falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  GraphHacks_pgdata:
  GraphHacks_falkordb_data:
